# Rebuilds data/routes.geojson from data/sheaf.geojson, then publishes the site.
# Runs on every push to main, and from the "Run workflow" button on the Actions tab.

name: Build and deploy map

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # save the rebuilt routes.geojson back to the repo
  pages: write      # publish the site
  id-token: write   # required by the publish step

concurrency:
  group: pages
  cancel-in-progress: false   # let a run finish; the next one waits its turn

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build data/routes.geojson from data/sheaf.geojson
        run: python scripts/build_routes.py

      - name: Save routes.geojson to the repo if it changed
        run: |
          if [ -n "$(git status --porcelain data/routes.geojson)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898783+github-actions[bot]@users.noreply.github.com"
            git add data/routes.geojson
            git commit -m "Rebuild routes.geojson from sheaf.geojson"
            git pull --rebase   # in case something else was pushed meanwhile
            git push
          else
            echo "routes.geojson already up to date"
          fi

      - uses: actions/configure-pages@v5

      - name: Publish only the page and its data
        run: mkdir _site && cp -r index.html data _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
